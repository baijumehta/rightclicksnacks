<!doctype html>
<!-- @dsCard group="Colors" name="Tertiary & mark colors" subtitle="Amber highlight + logo orange" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-sans);background:#fff;color:var(--fg-1)}
.wrap{padding:22px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-400);margin-bottom:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.sw{border-radius:12px;border:1px solid var(--border-1);overflow:hidden;width:150px}
.sw .chip{height:64px}
.sw .meta{padding:8px 10px}
.sw .name{font-size:13px;font-weight:700;color:var(--fg-1)}
.sw .hex{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

</style></head><body><div class="wrap">
<div class="lbl">Tertiary · highlight only</div>
<div class="row">
<div class="sw"><div class="chip" style="background:#FFBD59"></div><div class="meta"><div class="name">Amber</div><div class="hex">#FFBD59 · highlight</div></div></div>
<div class="sw"><div class="chip" style="background:#FFCE83"></div><div class="meta"><div class="name">Amber Soft</div><div class="hex">#FFCE83 · highlight</div></div></div>
<div class="sw"><div class="chip" style="background:#F36B22"></div><div class="meta"><div class="name">Mark Orange</div><div class="hex">#F36B22 · logo mark only</div></div></div>
</div></div></body></html>
