<!doctype html>
<!-- @dsCard group="Brand" name="Logo mark" subtitle="Mark on white, tint & navy" viewport="700x172" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans)}
.wrap{display:flex;gap:0}
.cell{flex:1;height:172px;display:flex;align-items:center;justify-content:center}
.light{background:#fff}.tint{background:#EBF5FB}.navy{background:#0D273C}
.cell img{height:88px}
.tag{position:absolute;bottom:8px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-400)}
.cell{position:relative}.navy .tag{color:#4FB6E2}
</style></head><body>
<div class="wrap">
<div class="cell light"><img src="../assets/right-click-badge-black.png"><span class="tag">on white · black text</span></div>
<div class="cell tint"><img src="../assets/right-click-badge-black.png"><span class="tag">on tint · black text</span></div>
<div class="cell navy"><img src="../assets/right-click-mark.png"><span class="tag">on dark · white text</span></div>
</div></body></html>
