<!-- @dsCard group="Brand" name="Right Click Plus service marks" subtitle="Plus-service badges — computer & network equipment only" viewport="700x250" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: #fff; padding: 22px 24px; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-400); margin-bottom: 6px; }
  .note { font-size: 12.5px; color: var(--fg-3); margin-bottom: 18px; max-width: 620px; line-height: 1.45; }
  .row { display: flex; gap: 18px; }
  .card { flex: 1; border: 1px solid var(--border-1); border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 16px; background: var(--bg-2); }
  .card img { width: 78px; height: 78px; flex: none; }
  .card b { font-size: 15px; color: var(--navy-900); display: block; margin-bottom: 4px; }
  .card span { font-size: 12.5px; color: var(--fg-2); line-height: 1.4; }
</style>
</head>
<body>
<div class="lbl">Right Click Plus service marks</div>
<div class="note">Use only when referring to a Right Click Plus service. Do not use as a general company logo.</div>
<div class="row">
  <div class="card">
    <img src="../assets/rc-plus-computer-service.png" alt="Right Click Plus Computer Service" />
    <div><b>Computer Service</b><span>Right Click Plus Business Computers</span></div>
  </div>
  <div class="card">
    <img src="../assets/rc-plus-network-service.png" alt="Right Click Plus Network Equipment Service" />
    <div><b>Network Equipment Service</b><span>Right Click Plus Critical Network Equipment / Infrastructure</span></div>
  </div>
</div>
</body>
</html>
