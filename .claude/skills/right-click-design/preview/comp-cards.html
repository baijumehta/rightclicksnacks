<!doctype html>
<!-- @dsCard group="Components" name="Service cards" subtitle="Icon tile cards, light & navy" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-sans);background:#fff;color:var(--fg-1)}
.wrap{padding:22px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-400);margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.card{background:#fff;border:1px solid #E2E4E8;border-radius:16px;padding:24px;width:240px;box-shadow:0 8px 24px rgba(13,39,60,.10)}
.tile{width:46px;height:46px;border-radius:12px;background:#EBF5FB;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.tile i{width:24px;height:24px;color:#0098D5}
.card h4{font-size:18px;font-weight:700;margin-bottom:7px}
.card p{font-size:14px;color:var(--fg-2);line-height:1.5}
.card.alt{background:#0D273C}
.card.alt h4{color:#fff}.card.alt p{color:#9AD4EE}
.card.alt .tile{background:rgba(255,255,255,.08)}

</style></head><body><div class="wrap">
<div class="lbl">Service cards</div>
<div class="row" style="align-items:stretch">
<div class="card"><div class="tile"><i data-lucide="shield-check"></i></div><h4>Cybersecurity</h4><p>Proactive monitoring that keeps you a step ahead of attacks.</p></div>
<div class="card"><div class="tile"><i data-lucide="server"></i></div><h4>Managed IT</h4><p>Onsite and remote support that prevents problems before they start.</p></div>
<div class="card alt"><div class="tile"><i data-lucide="check-circle"></i></div><h4>Compliance</h4><p>CMMC, HIPAA and SOC 2 frameworks done right.</p></div>
</div><script>lucide.createIcons();</script></div></body></html>
