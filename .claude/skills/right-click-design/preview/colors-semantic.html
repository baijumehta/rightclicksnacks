<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Text, link & status tokens" viewport="700x190" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-sans);background:#fff;color:var(--fg-1)}
.wrap{padding:22px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-400);margin-bottom:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.sw{border-radius:12px;border:1px solid var(--border-1);overflow:hidden;width:150px}
.sw .chip{height:64px}
.sw .meta{padding:8px 10px}
.sw .name{font-size:13px;font-weight:700;color:var(--fg-1)}
.sw .hex{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

</style></head><body><div class="wrap">
<div class="lbl">Semantic · text, surface & status</div>
<div class="row" style="gap:10px">
<div class="sw"><div class="chip" style="background:#0D273C"></div><div class="meta"><div class="name">fg-1 text</div><div class="hex">#0D273C</div></div></div>
<div class="sw"><div class="chip" style="background:#4C5662"></div><div class="meta"><div class="name">fg-2 body</div><div class="hex">#4C5662</div></div></div>
<div class="sw"><div class="chip" style="background:#6B7682"></div><div class="meta"><div class="name">fg-3 muted</div><div class="hex">#6B7682</div></div></div>
<div class="sw"><div class="chip" style="background:#0086BD"></div><div class="meta"><div class="name">link</div><div class="hex">#0086BD</div></div></div>
</div>
<div class="row" style="gap:10px;margin-top:12px">
<div class="sw"><div class="chip" style="background:#1E9E6A"></div><div class="meta"><div class="name">success</div><div class="hex">#1E9E6A</div></div></div>
<div class="sw"><div class="chip" style="background:#FFBD59"></div><div class="meta"><div class="name">warning</div><div class="hex">#FFBD59</div></div></div>
<div class="sw"><div class="chip" style="background:#D7443E"></div><div class="meta"><div class="name">danger</div><div class="hex">#D7443E</div></div></div>
<div class="sw"><div class="chip" style="background:#0098D5"></div><div class="meta"><div class="name">info</div><div class="hex">#0098D5</div></div></div>
</div></div></body></html>
