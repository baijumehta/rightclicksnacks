<!doctype html>
<!-- @dsCard group="Components" name="Badges & pills" subtitle="Trust signals & tags" viewport="700x130" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-sans);background:#fff;color:var(--fg-1)}
.wrap{padding:22px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-400);margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}
.pill i{width:14px;height:14px}
.p-blue{background:#EBF5FB;color:#0086BD}
.p-navy{background:#0D273C;color:#fff}
.p-amber{background:#FFCE83;color:#0D273C}
.p-success{background:#E4F5EE;color:#1E9E6A}
.p-outline{background:#fff;border:1.5px solid #CBD0D7;color:var(--fg-2)}

</style></head><body><div class="wrap">
<div class="lbl">Badges & pills</div>
<div class="row">
<span class="pill p-blue"><i data-lucide="cloud"></i> Microsoft Partner</span>
<span class="pill p-navy">24/7 Support</span>
<span class="pill p-amber"><i data-lucide="star"></i> 95% rating</span>
<span class="pill p-success"><i data-lucide="check"></i> CMMC Ready</span>
<span class="pill p-outline">Since 1997</span>
</div><script>lucide.createIcons();</script></div></body></html>
