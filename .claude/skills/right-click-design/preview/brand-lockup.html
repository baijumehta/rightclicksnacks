<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockup" subtitle="Official horizontal lockup: light, tint & reversed" viewport="700x172" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:#fff}
.wrap{padding:0}
.lbl{position:absolute;top:8px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-400)}
.grid{display:flex}
.cell{flex:1;height:172px;display:flex;align-items:center;justify-content:center;position:relative;padding:24px}
.light{background:#fff}
.tint{background:#EBF5FB}
.navy{background:#0D273C}
.cell img{max-width:88%;max-height:64px;width:auto;height:auto}
.navy .lbl{color:#4FB6E2}
.tint .lbl{color:#5a93b3}
.divider{width:1px;background:var(--border-1)}
</style></head><body>
<div class="grid">
  <div class="cell light"><span class="lbl">Primary · on white</span><img src="../assets/right-click-lockup.png" alt="Right Click"></div>
  <div class="divider"></div>
  <div class="cell tint"><span class="lbl">on tint</span><img src="../assets/right-click-lockup.png" alt="Right Click"></div>
  <div class="divider"></div>
  <div class="cell navy"><span class="lbl">reversed · on navy</span><img src="../assets/right-click-lockup-white.png" alt="Right Click"></div>
</div>
</body></html>
