<!doctype html>
<!-- @dsCard group="Brand" name="Squad model" subtitle="Dedicated Squad + org depth" viewport="700x235" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-sans);background:#fff;color:var(--fg-1)}
.wrap{padding:22px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-400);margin-bottom:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.roles{display:flex;gap:12px}
.role{flex:1;border:1px solid var(--border-1);border-radius:12px;padding:15px 16px;background:#fff}
.role .tile{width:38px;height:38px;border-radius:10px;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.role .tile i{width:20px;height:20px}
.role b{font-size:14.5px;color:var(--navy-900)}
.depth{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--divider)}
.depth .dl{font-size:15px;font-weight:700;color:var(--navy-900)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--navy-800);background:#fff;border:1.5px solid var(--blue-200);border-radius:999px;padding:7px 13px}
.chip i{width:14px;height:14px;color:var(--blue-500)}

</style></head><body><div class="wrap">
<div class="lbl">The Dedicated Squad model</div>
<div class="roles">
<div class="role"><span class="tile"><i data-lucide="user-round-cog"></i></span><b>Squad Leader</b></div>
<div class="role"><span class="tile"><i data-lucide="headset"></i></span><b>Helpdesk Engineers</b></div>
<div class="role"><span class="tile"><i data-lucide="wrench"></i></span><b>Onsite Engineers</b></div>
</div>
<div class="depth">
<span class="dl">Backed by</span>
<span class="chip"><i data-lucide="arrow-up-right"></i> Escalation Squad</span>
<span class="chip"><i data-lucide="clock"></i> 24/7 TAC</span>
<span class="chip"><i data-lucide="layers-3"></i> PSG</span>
<span class="chip"><i data-lucide="truck"></i> Logistics</span>
</div><script>lucide.createIcons();</script></div></body></html>
